version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: amip-postgres
    environment:
      POSTGRES_USER: amip_admin
      POSTGRES_PASSWORD: amip_secure_2026
      POSTGRES_DB: amip_market_intelligence
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - amip_postgres_data:/var/lib/postgresql/data
      - ../Database/Migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amip_admin -d amip_market_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - amip-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: amip-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@amip.local
      PGADMIN_DEFAULT_PASSWORD: admin_2026
    ports:
      - "5050:80"
    volumes:
      - amip_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - amip-network

volumes:
  amip_postgres_data:
    driver: local
  amip_pgadmin_data:
    driver: local

networks:
  amip-network:
    driver: bridge
